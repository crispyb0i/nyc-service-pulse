name: Quality and rendering budgets
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse_ci_only
          POSTGRES_DB: nyc_service_pulse
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U pulse -d nyc_service_pulse"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://pulse:pulse_ci_only@127.0.0.1:54329/nyc_service_pulse
      TEST_DATABASE_URL: postgres://pulse:pulse_ci_only@127.0.0.1:54329/nyc_service_pulse
      PLAYWRIGHT_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --import tsx scripts/seed-ci.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Production browser checks and bounded rendering
        run: |
          npm start > /tmp/pulse-server.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:3100/api/health && break || sleep 1; done
          npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            reports/portfolio/
            /tmp/pulse-server.log
          retention-days: 14
