name: nyc-service-pulse
services:
  db:
    image: postgis/postgis:17-3.5@sha256:8dfee83d8bd4c2873dc4a233c13ba2799a44f2edb16a0552d58715917fac32ba
    platform: linux/amd64
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse_local_only
      POSTGRES_DB: nyc_service_pulse
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d nyc_service_pulse"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 1g
    cpus: 1.5
    shm_size: 128mb
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=30"]
volumes:
  pulse_pgdata:
